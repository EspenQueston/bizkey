<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Applies the theme class before first paint so a fresh visitor (no
      // 'bizkey-theme' in localStorage yet) sees the dark default immediately
      // instead of a flash of the light :root CSS defaults followed by a
      // flip to dark once ThemeProvider's useEffect runs post-mount. Mirrors
      // ThemeProvider's own resolution logic exactly (src/components/theme-provider.tsx)
      // so this can never disagree with what React settles on right after.
      (function () {
        try {
          var stored = localStorage.getItem('bizkey-theme');
          var resolved;
          if (stored === 'dark' || stored === 'light') {
            resolved = stored;
          } else if (stored === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } else {
            resolved = 'dark';
          }
          document.documentElement.classList.add(resolved);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="/brand/icone.png" />
    <link rel="apple-touch-icon" href="/brand/icone.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0A1B33" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BizKey — New Vision | Sourcing intelligent depuis la Chine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <meta name="twitter:image" content="/brand/avec-icone.png">
</head>

  </body>
</html>
